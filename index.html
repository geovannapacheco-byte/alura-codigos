<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Bovinocultura</title>
<style>
body{
    font-family:Arial;
    background:#eef5e8;
    text-align:center;
    color:#3e2723;
}
header{
    background:#6d4c41;
    color:white;
    padding:20px;
}
.card{
    background:white;
    max-width:450px;
    margin:30px auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 10px #999;
}
button{
    background:#558b2f;
    color:white;
    border:0;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
<h1>🐄 Bovinocultura</h1>
<p>Criação e manejo de bovinos</p>
</header>

<div class="card">
<h2>🌱 Produção de Gado</h2>
<p>🐂 Alimentação: Pastagem</p>
<p>💧 Água: Disponível</p>
<p>💉 Saúde: Vacinação em dia</p>
<p>🥩 Produção: Corte</p>

<button onclick="dica()">Ver dica</button>
<p id="dica"></p>
</div>

<script>
function dica(){
document.getElementById("dica").innerHTML =
"💡 Mantenha os animais bem alimentados, hidratados e saudáveis!";
}
</script>

</body>
</html>
